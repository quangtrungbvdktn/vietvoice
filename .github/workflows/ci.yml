name: VietVoice release gate
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIMARY_TRANSLATION_API_KEY: ci-sentinel-primary-translation
      OPENROUTER_API_KEY: ci-sentinel-openrouter-not-a-real-key
      GEMINI_API_KEY: ci-sentinel-gemini-not-a-real-key
      VIETVOICE_PRIVATE_ACCESS_TOKEN: ci-sentinel-private-access-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node -e "import('./apps/api/dist/server.mjs')"
      - run: pnpm security:scan
      - run: pnpm --filter @vietvoice/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vietvoice/agent prepare:paraformer
      - run: pnpm --filter @vietvoice/agent verify:paraformer
      - name: Install FFmpeg runtime
        run: choco install ffmpeg -y --no-progress
      - name: Stage FFmpeg runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "apps/agent/resources/bin" | Out-Null
          Copy-Item (Get-Command ffmpeg).Source "apps/agent/resources/bin/ffmpeg.exe"
          Copy-Item (Get-Command ffprobe).Source "apps/agent/resources/bin/ffprobe.exe"
      - run: pnpm --filter @vietvoice/agent typecheck
      - run: pnpm --filter @vietvoice/agent test
      - run: pnpm --filter @vietvoice/agent dist:win
